name: TuneNook
options:
  bundleIdPrefix: io.github.vantoantrinh96
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.4.1"
    CURRENT_PROJECT_VERSION: "3"
    DEVELOPMENT_TEAM: ""
    # Apple silicon only; Intel Macs are not supported.
    ARCHS: arm64
targets:
  TuneNook:
    type: application
    platform: macOS
    sources:
      - path: TuneNook
    info:
      path: TuneNook/Info.plist
      properties:
        CFBundleDisplayName: TuneNook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
    entitlements:
      path: TuneNook/TuneNook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vantoantrinh96.tunenook
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
  TuneNookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TuneNookTests
    dependencies:
      - target: TuneNook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vantoantrinh96.tunenook.tests
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: true
schemes:
  TuneNook:
    build:
      targets:
        TuneNook: all
        TuneNookTests: [test]
    test:
      targets:
        - TuneNookTests
