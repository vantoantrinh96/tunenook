name: Tomatune
options:
  bundleIdPrefix: io.github.vantoantrinh96
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Tomatune:
    type: application
    platform: macOS
    sources:
      - path: Tomatune
    info:
      path: Tomatune/Info.plist
      properties:
        CFBundleDisplayName: Tomatune
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
    entitlements:
      path: Tomatune/Tomatune.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vantoantrinh96.tomatune
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
  TomatuneTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TomatuneTests
    dependencies:
      - target: Tomatune
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vantoantrinh96.tomatune.tests
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: true
schemes:
  Tomatune:
    build:
      targets:
        Tomatune: all
        TomatuneTests: [test]
    test:
      targets:
        - TomatuneTests
