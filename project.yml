name: TuneNook
options:
  bundleIdPrefix: io.github.vantoantrinh96
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "0.8.0"
    CURRENT_PROJECT_VERSION: "9"
    DEVELOPMENT_TEAM: ""
    # Apple silicon only; Intel Macs are not supported.
    ARCHS: arm64
# Sparkle 2.10.1; tarball SHA-256 (used by release CI).
# After any Sparkle version bump: update SPARKLE_VERSION/SPARKLE_SHA256 in .github/workflows/release.yml,
# and re-check the private window-controller class names SUStatusController and SUUpdateAlert
# used in TuneNook/System/UpdaterController.swift.
# SPARKLE_VERSION=2.10.1
# SPARKLE_SHA256=1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.10.1
  MCP:
    url: https://github.com/modelcontextprotocol/swift-sdk
    exactVersion: 0.12.1
targets:
  TuneNook:
    type: application
    platform: macOS
    sources:
      - path: TuneNook
    info:
      path: TuneNook/Info.plist
      properties:
        CFBundleDisplayName: TuneNook
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSUIElement: true
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: ""
        SUFeedURL: https://github.com/vantoantrinh96/tunenook/releases/latest/download/appcast.xml
        SUPublicEDKey: mPUABJrxGzP3c+xoB00wOMNeVgKTZsAbSxjVm9Ei6Rs=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
        SUEnableInstallerLauncherService: true
    entitlements:
      path: TuneNook/TuneNook.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.network.server: true
        com.apple.security.files.user-selected.read-write: true
        com.apple.security.files.bookmarks.app-scope: true
        # Ad-hoc signing has no Team ID, so Hardened Runtime library validation
        # rejects the embedded Sparkle.framework. Sparkle updates are verified
        # by EdDSA instead.
        com.apple.security.cs.disable-library-validation: true
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
    dependencies:
      - package: Sparkle
      - package: MCP
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vantoantrinh96.tunenook
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_STYLE: Automatic
        CODE_SIGN_IDENTITY: "-"
        ENABLE_HARDENED_RUNTIME: true
        GENERATE_INFOPLIST_FILE: false
  TuneNookTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: TuneNookTests
    dependencies:
      - target: TuneNook
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.github.vantoantrinh96.tunenook.tests
        CODE_SIGN_IDENTITY: "-"
        GENERATE_INFOPLIST_FILE: true
schemes:
  TuneNook:
    build:
      targets:
        TuneNook: all
        TuneNookTests: [test]
    test:
      targets:
        - TuneNookTests
