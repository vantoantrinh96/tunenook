name: CI

on:
  pull_request:
    branches: [main]
    paths-ignore: ["**.md"]
  push:
    branches: [main]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  security:
    name: Security scan
    # Linux minutes are 10x cheaper than macOS, so scan first and only build if it passes.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      SEMGREP_VERSION: 1.184.0
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0 # Gitleaks scans the whole history

      - name: Secrets (Gitleaks)
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar xz gitleaks
          ./gitleaks git . --no-banner --redact --exit-code 1

      - name: Code (Semgrep)
        run: |
          docker run --rm -v "$PWD:/src" -w /src "semgrep/semgrep:${SEMGREP_VERSION}" \
            semgrep scan --metrics=off --error \
              --config p/swift \
              --config p/secrets \
              --config p/github-actions

  build-test:
    name: Build & test
    needs: security
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Show Xcode
        run: xcodebuild -version

      - name: Generate project
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build
        run: xcodebuild -scheme TuneNook -destination 'platform=macOS' -derivedDataPath build build

      - name: Test
        run: xcodebuild -scheme TuneNook -destination 'platform=macOS' -derivedDataPath build test
