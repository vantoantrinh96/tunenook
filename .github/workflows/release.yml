name: Release

# After CI passes on main, bump the version from the merged PR's title and tag it.
# Only a bump builds the app: the Release build is packed as a .dmg and a .zip and published as a GitHub Release.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: read

jobs:
  version:
    name: Bump version
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.bump.outputs.version }}
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      MERGED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: main
          fetch-depth: 0
          # main is protected (PRs only). This deploy key is the ruleset's only bypass, so the
          # bump commit and tag below can be pushed. GITHUB_TOKEN can't bypass on a personal repo.
          ssh-key: ${{ secrets.RELEASE_DEPLOY_KEY }}

      - name: Find PRs merged since the last release
        id: pr
        # A stack merges several PRs at once (upper PRs into the branch below them), and a failed
        # release leaves PRs for the next one. So take every PR merged since the last tag whose
        # commits are now on main, and use the biggest bump among them.
        run: |
          last=$(git describe --tags --abbrev=0 --match 'v[0-9]*' HEAD 2>/dev/null || true)
          since=${last:+$(git log -1 --format=%cI "$last")}
          echo "Last release: ${last:-none}" >> "$GITHUB_STEP_SUMMARY"
          gh pr list --repo "$REPO" --state merged --limit 200 \
            --search "${since:+merged:>$since}" \
            --json number,title,headRefOid \
            --jq '.[] | "\(.number)\t\(.headRefOid)\t\(.title)"' |
          while IFS=$'\t' read -r number head title; do
            if git merge-base --is-ancestor "$head" HEAD 2>/dev/null; then
              printf '%s\t%s\n' "$number" "$title"
            fi
          done | sort -n > prs.tsv

          if [ ! -s prs.tsv ]; then
            echo "No merged PRs since ${last:-the start}; nothing to release." | tee -a "$GITHUB_STEP_SUMMARY"
            echo "level=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          while IFS=$'\t' read -r number title; do
            echo "- #$number \"$title\" → $(scripts/release.sh level "$title" || true)"
          done < prs.tsv | tee -a "$GITHUB_STEP_SUMMARY"

          level=$(cut -f2- prs.tsv | scripts/release.sh highest)
          numbers=$(cut -f1 prs.tsv | sed 's/^/#/' | paste -sd ' ' -)
          echo "Bump: **$level**" | tee -a "$GITHUB_STEP_SUMMARY"
          echo "level=$level" >> "$GITHUB_OUTPUT"
          echo "numbers=$numbers" >> "$GITHUB_OUTPUT"
          rm prs.tsv

      - name: Bump and tag
        id: bump
        if: contains(fromJSON('["major","minor","patch"]'), steps.pr.outputs.level)
        env:
          LEVEL: ${{ steps.pr.outputs.level }}
          NUMBERS: ${{ steps.pr.outputs.numbers }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          version=$(scripts/release.sh bump "$LEVEL")
          # [skip ci]: unlike GITHUB_TOKEN, a deploy-key push triggers workflows; the bump needs no CI run.
          git commit -am "chore(release): v$version" -m "Includes $NUMBERS." -m "[skip ci]"
          git tag -a "v$version" -m "TuneNook $version"
          git push origin HEAD:main "v$version"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Bumped to **v$version** ($LEVEL, from $NUMBERS)." >> "$GITHUB_STEP_SUMMARY"

  build:
    name: Build & publish
    needs: version
    if: needs.version.outputs.version != ''
    runs-on: macos-15
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: ${{ github.repository }}
      VERSION: ${{ needs.version.outputs.version }}
      # Must match the Sparkle version and tarball SHA-256 recorded in project.yml.
      SPARKLE_VERSION: 2.10.1
      SPARKLE_SHA256: 1a856d2a9edb8e628de88121d7be04cf0e2167f8641650b78fca00b14244cf27
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: v${{ needs.version.outputs.version }}

      - name: Build Release
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -scheme TuneNook -configuration Release -destination 'generic/platform=macOS' \
            -derivedDataPath build build

      - name: Package
        run: |
          app=build/Build/Products/Release/TuneNook.app
          scripts/make-dmg.sh "$app" "TuneNook-$VERSION.dmg"
          ditto -c -k --keepParent "$app" "TuneNook-$VERSION.zip"
          shasum -a 256 "TuneNook-$VERSION.dmg" "TuneNook-$VERSION.zip" > "TuneNook-$VERSION.sha256"
          cat "TuneNook-$VERSION.sha256"

      - name: Fetch Sparkle tools
        # Runs before the release is created so a missing secret or bad download fails early,
        # without leaving a release that has no appcast.
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          if [ -z "$SPARKLE_ED_PRIVATE_KEY" ]; then
            echo "::error::SPARKLE_ED_PRIVATE_KEY is empty; cannot sign the update."
            exit 1
          fi

          mkdir sparkle
          curl -sSfL -o sparkle.tar.xz \
            "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz"
          echo "$SPARKLE_SHA256  sparkle.tar.xz" | shasum -a 256 -c -
          tar -xf sparkle.tar.xz -C sparkle
          test -x sparkle/bin/sign_update

      - name: Publish GitHub Release
        run: |
          # Idempotent: a re-run after a later step failed must not fail at create.
          gh release view "v$VERSION" --repo "$REPO" >/dev/null 2>&1 || \
            gh release create "v$VERSION" --repo "$REPO" --verify-tag \
              --title "TuneNook $VERSION" --generate-notes \
              "TuneNook-$VERSION.dmg" "TuneNook-$VERSION.zip" "TuneNook-$VERSION.sha256"
          echo "Published **TuneNook $VERSION** with TuneNook-$VERSION.dmg and TuneNook-$VERSION.zip." >> "$GITHUB_STEP_SUMMARY"

      - name: Publish appcast
        # The appcast embeds the release notes, so it is built after the release exists.
        # The private key reaches sign_update only through env and stdin; no xtrace, no file.
        env:
          SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          # Sign the zip the release actually serves: on a re-run the local build differs from it.
          gh release download "v$VERSION" --repo "$REPO" -p "TuneNook-$VERSION.zip" --clobber
          signature=$(printf '%s' "$SPARKLE_ED_PRIVATE_KEY" | sparkle/bin/sign_update --ed-key-file - "TuneNook-$VERSION.zip")
          gh release view "v$VERSION" --repo "$REPO" --json body -q .body > notes.md
          scripts/make-appcast.sh "$VERSION" "$(scripts/release.sh build)" \
            "https://github.com/$REPO/releases/download/v$VERSION/TuneNook-$VERSION.zip" \
            "https://github.com/$REPO/releases/tag/v$VERSION" \
            "$signature" notes.md > appcast.xml
          xmllint --noout appcast.xml

          gh release upload "v$VERSION" --repo "$REPO" --clobber appcast.xml
          echo "Published appcast.xml for **TuneNook $VERSION** (build $(scripts/release.sh build))." >> "$GITHUB_STEP_SUMMARY"
