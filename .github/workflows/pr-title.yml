name: PR title

on:
  pull_request:
    branches: [main]
    types: [opened, edited, synchronize, reopened]

permissions:
  contents: read

jobs:
  conventional-title:
    name: Conventional title
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Check title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: |
          if level=$(scripts/release.sh level "$TITLE"); then
            echo "✅ \"$TITLE\" → version bump on merge: $level" | tee -a "$GITHUB_STEP_SUMMARY"
          else
            {
              echo "❌ PR title must follow Conventional Commits, e.g."
              echo "  feat: add weekly stats        → minor bump (0.3.0 → 0.4.0)"
              echo "  fix|perf|chore: …             → patch bump (0.3.0 → 0.3.1)"
              echo "  feat!: new data model         → major bump (0.3.0 → 1.0.0)"
              echo "  docs|ci|test|refactor|build|style|revert: … → no release"
            } | tee -a "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
